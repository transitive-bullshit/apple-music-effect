    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Apple Music, Made by Code",
        "url": "https://apple-music-effect.vercel.app/",
        "description": "A real-time recreation of the liquid logo animation from Apple Music's new identity, ray traced in your browser. Drop in your own icon and wordmark, and export an MP4.",

        "operatingSystem": "Any (a browser with WebGL2)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"

  </head>
  <body>
    <main class="stage">
      <canvas></canvas>
      <div class="overlay" data-overlay hidden></div>
    </main>
    <input
      type="file"
      accept="image/svg+xml,image/png,image/jpeg,image/webp"
      hidden
      data-file
    />
    <div class="controls">
      <button type="button" data-play>Play</button>
      <input
        type="range"
        min="0"
        step="0.001"
        value="0"
        aria-label="Seek"
        data-scrub
      />
      <span data-time></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
